<div class="report-container">

  <div class="header-row">

    <p class="header">Create Employee Report</p>

    <!-- Download Image Icon -->
    <img
      src="assets/download.png"
      alt="Download"
      class="download-icon"
      *ngIf="reportList.length > 0"
      (click)="downloadCSV()"
    />

  </div>

  <div class="form-row">

    <div class="form-group">
      <label>Start Date</label>
      <input type="date" [(ngModel)]="startDate">
    </div>

    <div class="form-group">
      <label>End Date</label>
      <input type="date" [(ngModel)]="endDate">
    </div>

    <div class="btn-group">
      <button (click)="createPersonReport()">
        Generate Report
      </button>
    </div>

  </div>

  <table class="report-table" *ngIf="reportList.length > 0">

    <thead>
      <tr>
        <th>Person ID</th>
        <th>Person Name</th>
        <th>Check In</th>
        <th>Check Out</th>
        <th>Time Spent (Minutes)</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let report of reportList">
        <td>{{ report.personId }}</td>
        <td>{{ report.personName }}</td>
        <td>{{ report.checkIn }}</td>
        <td>{{ report.checkOut }}</td>
        <td>{{ report.timeSpentMinutes }}</td>
      </tr>
    </tbody>

  </table>

</div>
